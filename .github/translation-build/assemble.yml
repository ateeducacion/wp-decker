name: Assemble French translations

on:
  push:
    branches:
      - agent/add-french-translations
    paths:
      - .github/translation-build/ready

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/add-french-translations

      - name: Assemble translation catalogues
        run: |
          cat .github/translation-build/po.* | base64 --decode | gzip --decompress > languages/decker-fr_FR.po
          cat .github/translation-build/mo.* | base64 --decode | gzip --decompress > languages/decker-fr_FR.mo
          rm -rf .github/translation-build

      - name: Commit generated catalogues
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add languages/decker-fr_FR.po languages/decker-fr_FR.mo .github/translation-build
          git commit -m "Add French translations"
          git push
