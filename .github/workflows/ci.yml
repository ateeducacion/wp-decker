---
name: CI

on:
  pull_request:
  push:
    tags:
      - '*'
    branches:
      - '*'

permissions:
  contents: read

jobs:
  lint_and_test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: PHP setup
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, curl, dom, json, pdo, mysql, xml, zip

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Install gettext
        run: sudo apt-get install -y gettext

      - name: Check untranslated strings
        run: make check-untranslated

      - name: Setup wp-env
        run: npm -g --no-fund i @wordpress/env

      - name: Start wp-env
        run: make up

      - name: Run code linting
        run: make lint

      - name: Run plugin check
        run: make check-plugin

      - name: Run unit tests
        shell: bash
        run: |
          set -o pipefail
          make test 2>&1 | tee /tmp/phpunit.log

      - name: Upload PHPUnit log
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: phpunit-log
          path: /tmp/phpunit.log
          retention-days: 1

      - name: Install npm dependencies and Playwright
        run: npm install && npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: make test-e2e
        env:
          CI: true
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1

      - name: Upload E2E test artifacts
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: artifacts/
          retention-days: 7
