name: Bootstrap issue 293 fix

on:
  push:
    branches:
      - fix/293-newest-notifications

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/293-newest-notifications

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Add failing regression expectation
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('tests/unit/includes/NotificationHandlerTest.php')
          content = path.read_text()

          old_docblock = '''\t/**
\t * Locks the CURRENT ascending sort + front slice for the AJAX endpoint.
\t *
\t * This documents a bug rather than endorsing it: the endpoint's comments
\t * promise newest-first but the code returns oldest-first and drops the
\t * newest entries once over the cap. Tracked in issue #293 — when that is
\t * fixed, this test must flip with it.
\t */'''
          new_docblock = '''\t/**
\t * The AJAX endpoint returns the newest notifications first and applies the cap.
\t */'''

          replacements = {
              old_docblock: new_docblock,
              'public function test_ajax_get_notifications_returns_oldest_first_and_caps_at_15()': 'public function test_ajax_get_notifications_returns_newest_first_and_caps_at_15()',
              "$this->assertSame( 'n1', $json['data'][0]['title'], 'Oldest notification should be first.' );": "$this->assertSame( 'n20', $json['data'][0]['title'], 'Newest notification should be first.' );",
              "$this->assertSame( 'n15', $json['data'][14]['title'], 'Newest five should be dropped from the front slice.' );": "$this->assertSame( 'n6', $json['data'][14]['title'], 'Oldest five should be dropped by the cap.' );",
          }

          for old, new in replacements.items():
              if old not in content:
                  raise SystemExit(f'Missing expected test fragment: {old[:80]}')
              content = content.replace(old, new, 1)

          path.write_text(content)
          PY

          git add tests/unit/includes/NotificationHandlerTest.php
          git commit -m "test: expect newest notifications first"

      - name: Implement notification ordering fix
        run: |
          python3 <<'PY'
          from pathlib import Path

          php_path = Path('includes/class-decker-notification-ajax.php')
          php_content = php_path.read_text()
          php_replacements = {
              '// Reverse so newest is at the front.': '// Sort newest first.',
              "return strtotime( $a['time'] ) - strtotime( $b['time'] );": "return strtotime( $b['time'] ) - strtotime( $a['time'] );",
              '// Return only the last 15 (most recent first).': '// Return only the newest notifications.',
          }

          for old, new in php_replacements.items():
              if old not in php_content:
                  raise SystemExit(f'Missing expected PHP fragment: {old}')
              php_content = php_content.replace(old, new, 1)

          php_path.write_text(php_content)

          js_path = Path('public/assets/js/decker-heartbeat.js')
          js_content = js_path.read_text()
          old_js = '''                    response.data.forEach(function(notification) {
                        addNotification(notification, false);
                    });'''
          new_js = '''                    response.data.slice().reverse().forEach(function(notification) {
                        addNotification(notification, false);
                    });'''

          if old_js not in js_content:
              raise SystemExit('Missing expected initial notification loop.')

          js_path.write_text(js_content.replace(old_js, new_js, 1))
          PY

          rm .github/workflows/fix-293-bootstrap.yml
          git add includes/class-decker-notification-ajax.php \
            public/assets/js/decker-heartbeat.js \
            .github/workflows/fix-293-bootstrap.yml
          git commit -m "fix: show newest notifications first"
          git push origin HEAD:fix/293-newest-notifications
