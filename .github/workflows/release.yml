---
name: Release

on:
  release:
    types: [published]
  # Manual runs build and upload the ZIP as a workflow artifact without
  # touching any release, so the packaging path can be exercised on demand.
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Version label for the package name (e.g. 1.2.3). Defaults to a dated dev label."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build_and_upload:
    runs-on: ubuntu-latest
    steps:
      # Checkout the code
      - uses: actions/checkout@v7

      # `make package` builds the runtime translation files before archiving,
      # which needs the WP-CLI i18n command from require-dev.
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      # `composer install` has just regenerated admin/vendor/ from the version
      # pinned in composer.lock. If it does not match the committed copy, either
      # someone edited it by hand or updated it without committing the result —
      # and since `wp dist-archive` packages the working tree, the release would
      # ship a library nobody reviewed.
      - name: Check the bundled library matches the lock
        run: git diff --exit-code -- admin/vendor

      - name: Set environment variables
        env:
          RAW_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.release_tag }}
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            VERSION_TAG="${RAW_TAG#v}"  # Delete the initial 'v' if exists
            if [ -z "$VERSION_TAG" ]; then
              echo "::error::Could not determine release tag" >&2
              exit 1
            fi
          else
            VERSION_TAG="${INPUT_TAG#v}"
            if [ -z "$VERSION_TAG" ]; then
              VERSION_TAG="manual-$(date +%Y%m%d)-${GITHUB_SHA::7}"
            fi
          fi
          echo "RELEASE_TAG=${VERSION_TAG}" >> $GITHUB_ENV

      - name: Create package using the Makefile
        run: make package VERSION=${RELEASE_TAG}

      # Always kept, so a manual run leaves something downloadable to inspect.
      - name: Upload ZIP as a workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: decker-${{ env.RELEASE_TAG }}
          path: decker-${{ env.RELEASE_TAG }}.zip

      - name: Upload ZIP to the release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v3
        with:
          files: decker-${{ env.RELEASE_TAG }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # - name: Deploy to WordPress
      #   uses: 10up/action-wordpress-plugin-deploy@v2.2.2
      #   with:
      #     plugin_slug: decker
      #     svn_username: ${{ secrets.WP_SVN_USERNAME }}
      #     svn_password: ${{ secrets.WP_SVN_PASSWORD }}
